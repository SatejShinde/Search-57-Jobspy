name: watch-jobspy

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch-jobspy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check LinkedIn/Indeed/ZipRecruiter for new postings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobspy_watch.py

      - name: Commit updated state
        run: |
          git config user.name "jobspy-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_jobspy.json
          git diff --staged --quiet || git commit -m "state: jobspy tier update"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
