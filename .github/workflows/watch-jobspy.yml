name: watch-jobspy

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watch-jobspy
  cancel-in-progress: false
  queue: max

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect the existing three searches without per-result detail fetches
        env:
          JOBSPY_DESCRIPTIONS_ENABLED: ${{ vars.JOBSPY_DESCRIPTIONS_ENABLED }}
        run: python jobspy_watch.py --collect-only
      - name: Persist selected identities before any Telegram send
        run: python persist_state.py
      - name: Hand off transient listing descriptions
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jobspy-listing-descriptions
          path: .runtime/jobspy-listings.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore
      - name: Send original alerts in existing relevance order
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobspy_watch.py --alerts-only
      - name: Persist acknowledgements including partial runs
        if: always()
        run: python persist_state.py
      - name: Checkout private job archive with archive-only deploy key
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/checkout@v4
        with:
          repository: SatejShinde/Summer2027-Job-Archive
          ref: main
          path: .runtime/private-archive
          ssh-key: ${{ secrets.JOB_ARCHIVE_SSH_KEY }}
      - name: Publish archive outbox (alerts and pending state remain independent)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          ARCHIVE_TIER: jobspy
        run: |
          pip install -q jsonschema==4.26.0
          python archive_bridge.py --archive .runtime/private-archive --tier "jobspy"
      - name: Persist archive outbox acknowledgements
        if: always()
        run: python persist_state.py
      - name: Retain metadata checkpoints for failed-push recovery
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jobspy-recovery-${{ github.run_id }}
          path: |
            pending_jobspy.json
            state_jobspy.json
            archive_outbox_jobspy.json
          retention-days: 1
          if-no-files-found: ignore
